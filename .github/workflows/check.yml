name: Watch Bardo Tea Events

on:
  schedule:
    # Every 2 hours at :17 (an off-round minute). A random delay is added below.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Cron always fires on the same minute. A random 0-15 min delay spreads
      # the actual fetch so the traffic looks less mechanical. Skipped for
      # manual (workflow_dispatch) runs so testing stays immediate.
      - name: Random jitter
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 900 ))

      - run: python watcher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state if changed
        run: |
          for f in last_hash.txt last_success.txt last_canary.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update watcher state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying..."
            sleep 2
          done
          echo "Push failed after retries"
          exit 1
